name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build IPA
        run: bash scripts/build_ipa.sh

      - name: Build DEB (fallback package)
        run: bash scripts/build_deb.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MediaDeck-ipa
          path: build/MediaDeck.ipa
          if-no-files-found: error

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: MediaDeck-deb
          path: build/*.deb
          if-no-files-found: warn
